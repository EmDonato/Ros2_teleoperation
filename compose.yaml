services:
  open-pi-joystick:
    image: open-pi-joystick-img
    container_name: open-pi-joystick
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        interfaces: ../../interfaces

    network_mode: host
    privileged: true

    volumes:
      - /dev/input:/dev/input
      - ./:/open-Pi_joystick

    environment:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}

    command: ros2 launch joy_bringup joy_launch.py